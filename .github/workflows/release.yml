name: Release

# Publicar es parte del ciclo, no un trámite aparte.
#
# Cada push a main compila y pasa el typecheck: un cambio que rompe la app se ve
# aquí, no al empaquetar. La release sólo se sube si `version` en package.json
# es una que todavía no existe, de modo que los commits de ajuste no obliguen a
# la app instalada a descargar 119 MB.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Crear la release y subir los artefactos exige escritura sobre el repo.
permissions:
  contents: write

# Dos builds publicando a la vez se pisarían los assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Leer la versión declarada
        id: v
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v" -Encoding utf8
          Write-Host "package.json declara $v"

      - name: Comprobar si esa versión ya está publicada
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.v.outputs.version }}" 2>$null | Out-Null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$exists" -Encoding utf8
          if ($exists -eq 'true') {
            Write-Host "v${{ steps.v.outputs.version }} ya existe: se compila para verificar, sin publicar."
          } else {
            Write-Host "v${{ steps.v.outputs.version }} es nueva: se compila y se publica."
          }
          # `gh release view` sale con 1 cuando no encuentra la release, y ese
          # código haría fallar el paso pese a ser el caso normal.
          exit 0

      - name: Instalar dependencias
        run: npm ci

      # Typecheck incluido: esto corre en todos los push, publiquen o no.
      - name: Compilar
        run: npm run build

      - name: Empaquetar y publicar
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Nada que publicar
        if: steps.check.outputs.exists == 'true'
        run: Write-Host "Compilación verificada. Sube 'version' en package.json para lanzar una release nueva."
